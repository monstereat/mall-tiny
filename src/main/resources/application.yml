server:
  port: 8080

spring:
  application:
    name: observability-platform
  profiles:
    active: dev
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: monitor-worker-v1
      auto-offset-reset: earliest
      max-poll-records: ${MONITOR_KAFKA_MAX_POLL_RECORDS:200}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      ack-mode: batch

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    auto-mapping-behavior: partial
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization
  secret: observability-admin-secret
  expiration: 604800
  tokenHead: 'Bearer '

redis:
  database: monitor
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
  expire:
    common: 86400

monitor:
  ingest:
    rate-limit-per-minute: ${MONITOR_RATE_LIMIT_PER_MINUTE:5000}
  kafka:
    topics:
      error: monitor-error-v1
      performance: monitor-performance-v1
      behavior: monitor-behavior-v1
      replay: monitor-replay-v1
  clickhouse:
    url: ${CLICKHOUSE_JDBC_URL:jdbc:clickhouse://localhost:8123/monitor}
    username: ${CLICKHOUSE_USERNAME:default}
    password: ${CLICKHOUSE_PASSWORD:monitor}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ACCESS_KEY:monitor}
    secret-key: ${MINIO_SECRET_KEY:monitor123456}
    source-map-bucket: ${MINIO_SOURCEMAP_BUCKET:monitor-sourcemaps}

secure:
  ignored:
    urls:
      - /
      - /swagger-ui.html
      - /swagger-ui/
      - /*.html
      - /favicon.ico
      - /**/*.html
      - /**/*.css
      - /**/*.js
      - /swagger-resources/**
      - /v3/api-docs/**
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      - /api/v1/envelope