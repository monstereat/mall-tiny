server:
  forward-headers-strategy: framework
  port: 8080
  servlet:
    session:
      cookie:
        same-site: ${MONITOR_SESSION_COOKIE_SAME_SITE:Lax}
        secure: ${MONITOR_SESSION_COOKIE_SECURE:false}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      export:
        enabled: true

spring:
  application:
    name: observability-platform
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    template:
      observation-enabled: true
    producer:
      properties:
        max.request.size: ${MONITOR_KAFKA_MAX_REQUEST_SIZE:10485760}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: monitor-worker-v1
      auto-offset-reset: earliest
      max-poll-records: ${MONITOR_KAFKA_MAX_POLL_RECORDS:200}
      properties:
        fetch.max.bytes: ${MONITOR_KAFKA_FETCH_MAX_BYTES:16777216}
        max.partition.fetch.bytes: ${MONITOR_KAFKA_MAX_PARTITION_FETCH_BYTES:10485760}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      type: batch
      ack-mode: batch

mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
  configuration:
    auto-mapping-behavior: partial
    map-underscore-to-camel-case: true

jwt:
  tokenHeader: Authorization
  secret: observability-admin-secret
  expiration: 604800
  tokenHead: 'Bearer '

redis:
  database: monitor
  key:
    admin: 'ums:admin'
    resourceList: 'ums:resourceList'
  expire:
    common: 86400

monitor:
  sso:
    frontend-base-url: ${MONITOR_ADMIN_BASE_URL:http://localhost:18088}
    sp-private-key-base64: ${MONITOR_SAML_SP_PRIVATE_KEY_BASE64:}
    sp-certificate-base64: ${MONITOR_SAML_SP_CERTIFICATE_BASE64:}
  ai:
    enabled: ${MONITOR_AI_ENABLED:false}
    api-key: ${OPENAI_API_KEY:}
    base-url: ${MONITOR_AI_BASE_URL:https://api.openai.com/v1}
    model: ${MONITOR_AI_MODEL:gpt-6-astra}
  ingest:
    rate-limit-per-minute: ${MONITOR_RATE_LIMIT_PER_MINUTE:5000}
  kafka:
    topics:
      error: monitor-error-v1
      performance: monitor-performance-v1
      behavior: monitor-behavior-v1
      replay: monitor-replay-v1
      metric: monitor-metric-v1
      profile: monitor-profile-v1
  clickhouse:
    url: ${CLICKHOUSE_JDBC_URL:jdbc:clickhouse://localhost:8123/monitor}
    username: ${CLICKHOUSE_USERNAME:default}
    password: ${CLICKHOUSE_PASSWORD:monitor}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9002}
    access-key: ${MINIO_ACCESS_KEY:monitor}
    secret-key: ${MINIO_SECRET_KEY:monitor123456}
    source-map-bucket: ${MINIO_SOURCEMAP_BUCKET:monitor-sourcemaps}
    replay-retention-days: ${MONITOR_REPLAY_RETENTION_DAYS:30}
    replay-project-quota-bytes: ${MONITOR_REPLAY_PROJECT_QUOTA_BYTES:10737418240}
    replay-index-cleanup-cron: ${MONITOR_REPLAY_INDEX_CLEANUP_CRON:0 15 * * * *}
    replay-index-cleanup-batch-size: ${MONITOR_REPLAY_INDEX_CLEANUP_BATCH_SIZE:500}
    replay-index-cleanup-max-batches: ${MONITOR_REPLAY_INDEX_CLEANUP_MAX_BATCHES:10}

secure:
  ignored:
    urls:
      - /
      - /swagger-ui.html
      - /swagger-ui/
      - /*.html
      - /favicon.ico
      - /**/*.html
      - /**/*.css
      - /**/*.js
      - /swagger-resources/**
      - /v3/api-docs/**
      - /actuator/**
      - /druid/**
      - /admin/login
      - /admin/register
      - /admin/info
      - /admin/logout
      - /api/v1/envelope
      - /api/v1/otlp/**
      - /scim/v2/**
      - /saml2/**
      - /login/saml2/**
      - /monitor/sso/**

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-}]"
