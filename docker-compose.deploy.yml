services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: monitor_platform
      TZ: Asia/Shanghai
    volumes:
      - monitor_mysql_data:/var/lib/mysql
      - ./sql/mall_tiny.sql:/docker-entrypoint-initdb.d/01_mall_tiny.sql:ro
      - ./sql/monitor.sql:/docker-entrypoint-initdb.d/02_monitor.sql:ro

  redis:
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - monitor_redis_data:/data

  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monitor}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - monitor_clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-monitor}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-monitor123456}
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - monitor_minio_data:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - kafka
      - clickhouse
      - minio
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/monitor
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-monitor}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-monitor}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-monitor123456}
    ports:
      - "8080:8080"

  admin:
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8088:80"

volumes:
  monitor_mysql_data:
  monitor_redis_data:
  monitor_clickhouse_data:
  monitor_minio_data:
