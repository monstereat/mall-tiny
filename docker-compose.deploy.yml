name: monitor-platform

x-monitor-service-labels: &monitor-service-labels
  com.monstereat.observability: "true"

services:
  mysql:
    labels: *monitor-service-labels
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the secured deployment .env}
      MYSQL_DATABASE: monitor_platform
      TZ: Asia/Shanghai
    volumes:
      - monitor_mysql_data:/var/lib/mysql
      - ./sql/mall_tiny.sql:/docker-entrypoint-initdb.d/01_mall_tiny.sql:ro
      - ./sql/monitor.sql:/docker-entrypoint-initdb.d/02_monitor.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    labels: *monitor-service-labels
    image: redis:7.4
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - monitor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    labels: *monitor-service-labels
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_MESSAGE_MAX_BYTES: ${KAFKA_MESSAGE_MAX_BYTES:-10485760}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  clickhouse:
    labels: *monitor-service-labels
    image: clickhouse/clickhouse-server:26.8
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in the secured deployment .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - monitor_clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/config.d:/etc/clickhouse-server/config.d:ro
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  minio:
    labels: *monitor-service-labels
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    restart: unless-stopped
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the secured deployment .env}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the secured deployment .env}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - monitor_object_store_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  jaeger:
    labels: *monitor-service-labels
    image: jaegertracing/jaeger:2.21.0
    restart: unless-stopped
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:16686:16686"
    volumes:
      - ./infra/jaeger/config.yml:/etc/jaeger/config.yml:ro
      - monitor_jaeger_data:/badger
    command:
      - --config=/etc/jaeger/config.yml

  jaeger-storage-init:
    labels: *monitor-service-labels
    image: busybox:1.37.0
    restart: "no"
    user: "0:0"
    volumes:
      - monitor_jaeger_data:/badger
    command:
      - sh
      - -c
      - chown 10001:10001 /badger && chmod 0750 /badger

  otel-collector:
    labels: *monitor-service-labels
    image: otel/opentelemetry-collector-contrib:0.160.0
    restart: unless-stopped
    depends_on:
      - jaeger
      - loki
    volumes:
      - ./infra/otel/collector.yml:/etc/otelcol-contrib/config.yaml:ro
    command:
      - --config=/etc/otelcol-contrib/config.yaml

  server:
    labels: *monitor-service-labels
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      otel-collector:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the secured deployment .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CLICKHOUSE_JDBC_URL: jdbc:clickhouse://clickhouse:8123/monitor
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in the secured deployment .env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the secured deployment .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the secured deployment .env}
      MONITOR_AI_ENABLED: ${MONITOR_AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MONITOR_AI_BASE_URL: ${MONITOR_AI_BASE_URL:-https://api.openai.com/v1}
      MONITOR_AI_MODEL: ${MONITOR_AI_MODEL:-gpt-6-astra}
      MONITOR_REPLAY_RETENTION_DAYS: ${MONITOR_REPLAY_RETENTION_DAYS:-30}
      MONITOR_REPLAY_PROJECT_QUOTA_BYTES: ${MONITOR_REPLAY_PROJECT_QUOTA_BYTES:-10737418240}
      MONITOR_DATA_DELETION_API_ENABLED: ${MONITOR_DATA_DELETION_API_ENABLED:-true}
      MONITOR_DATA_DELETION_WORKER_ENABLED: ${MONITOR_DATA_DELETION_WORKER_ENABLED:-true}
      MONITOR_ADMIN_BASE_URL: ${MONITOR_ADMIN_BASE_URL:-http://localhost:18088}
      MONITOR_SAML_SP_PRIVATE_KEY_BASE64: ${MONITOR_SAML_SP_PRIVATE_KEY_BASE64:-}
      MONITOR_SAML_SP_CERTIFICATE_BASE64: ${MONITOR_SAML_SP_CERTIFICATE_BASE64:-}
      MONITOR_SESSION_COOKIE_SAME_SITE: ${MONITOR_SESSION_COOKIE_SAME_SITE:-None}
      MONITOR_SESSION_COOKIE_SECURE: ${MONITOR_SESSION_COOKIE_SECURE:-true}
      OTEL_SERVICE_NAME: observability-platform
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_TRACES_EXPORTER: otlp
      MONITOR_LOGGING_ENDPOINT: http://otel-collector:4317
      MONITOR_LOKI_URL: http://loki:3100
    ports:
      - "8080:8080"
      - "127.0.0.1:8081:8081"

  admin:
    labels: *monitor-service-labels
    build:
      context: ./admin
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8088:80"

  prometheus:
    labels: *monitor-service-labels
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
      alertmanager:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - monitor_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

  alertmanager:
    labels: *monitor-service-labels
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    volumes:
      - ./infra/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - monitor_alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  loki:
    labels: *monitor-service-labels
    image: grafana/loki:3.5.5
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    volumes:
      - ./infra/loki/config.yml:/etc/loki/config.yml:ro
      - monitor_loki_data:/loki

volumes:
  monitor_mysql_data:
  monitor_redis_data:
  monitor_clickhouse_data:
  monitor_object_store_data:
  monitor_prometheus_data:
  monitor_alertmanager_data:
  monitor_jaeger_data:
  monitor_loki_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.16.64.0/24
