name: monitor-ci

on:
  push:
    branches: [develop-me]
  pull_request:
    branches: [develop-me]
  workflow_dispatch:
    inputs:
      run_infrastructure_e2e:
        description: Run the infrastructure and browser E2E suite
        required: false
        default: false
        type: boolean

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Java tests with default and production Spring profiles
        run: |
          mvn -B test
          mvn -B -Dspring.profiles.active=prod test

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm --version

      - name: Build monitoring SDK and demo
        working-directory: monitor/sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Test SDK core telemetry
        working-directory: monitor/sdk
        run: node --test packages/core/test/*.test.mjs

      - name: Build admin console
        working-directory: admin
        run: |
          pnpm install --frozen-lockfile
          pnpm build

  infrastructure-e2e:
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.run_infrastructure_e2e) || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: monitor-platform-ci-${{ github.run_id }}
      MYSQL_ROOT_PASSWORD: monitor-platform-ci-mysql
      CLICKHOUSE_PASSWORD: monitor-platform-ci-clickhouse
      MINIO_ROOT_USER: monitor
      MINIO_ROOT_PASSWORD: monitor-platform-ci-minio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install monitoring workspace dependencies
        working-directory: monitor/sdk
        run: pnpm install --frozen-lockfile

      - name: Build the monitoring SDK and demo
        working-directory: monitor/sdk
        run: pnpm build

      - name: Install pinned Playwright Chromium
        working-directory: monitor/demo
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify ClickHouse S3 cold tier and deployment migrations
        run: bash infra/clickhouse/tests/s3-cold-tier.sh

      - name: Start the monitoring stack and browser demo
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml up -d --build

      - name: Wait for Server readiness
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            if curl --fail --silent --max-time 2 http://localhost:8081/actuator/health | grep -q '"status":"UP"'; then
              echo 'Server health check passed.'
              exit 0
            fi
            sleep 1
          done
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml logs --tail=160 server
          echo 'Server did not become healthy within 120 seconds.' >&2
          exit 1

      - name: Verify Alertmanager firing and recovery delivery
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml exec -T e2e-alert-receiver python /app/verify.py

      - name: Verify browser API and Kafka trace
        run: pnpm --dir monitor/demo test:e2e:trace --grep "browser API probe"

      - name: Verify project OTLP server span query
        run: pnpm --dir monitor/demo test:e2e:trace --grep "project OTLP server span"

      - name: Verify Issue auto-regression from browser error
        run: pnpm --dir monitor/demo test:e2e:trace --grep "real browser error reopens"

      - name: Verify Replay error context capture
        run: pnpm --dir monitor/demo test:e2e:trace --grep "opted-in unsampled session"

      - name: Verify default Replay sampling
        run: pnpm --dir monitor/demo test:e2e:trace --grep "without error retention"

      - name: Run infrastructure smoke tests
        run: bash monitor/scripts/e2e-smoke.sh

      - name: Capture monitoring diagnostics after failure
        if: failure()
        run: |
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml ps --all
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml logs --no-color --tail=120 server kafka clickhouse minio jaeger prometheus alertmanager e2e-alert-receiver demo
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml logs --no-color --tail=120 loki
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml exec -T server printenv MONITOR_DATA_DELETION_LOKI_POLL_DELAY_MS || true
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml exec -T e2e-alert-receiver python -c 'import hashlib,json,urllib.request; rows=json.load(urllib.request.urlopen("http://loki:3100/loki/api/v1/delete",timeout=5)); print(json.dumps([{"request_id":r.get("request_id"),"status":r.get("status"),"start_time":r.get("start_time"),"end_time":r.get("end_time"),"query_sha256":hashlib.sha256(str(r.get("query","")).encode()).hexdigest()[:16]} for r in rows[-20:]]))' || true
          for context in monitor/demo/test-results/*/error-context.md; do
            if [ -f "$context" ]; then
              echo "===== $context ====="
              cat "$context"
            fi
          done
          find monitor/demo -type f -name '*diagnostics.json' -print -exec cat {} \; || true

      - name: Upload Playwright failure attachments
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-playwright-failure-${{ github.run_id }}
          path: monitor/demo/**/*-diagnostics.json
          if-no-files-found: warn
          retention-days: 7

      - name: Stop the monitoring stack
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.deploy.yml -f monitor/demo/docker-compose.e2e.yml down --remove-orphans
