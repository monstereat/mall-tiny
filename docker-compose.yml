services:
  mysql:
    image: mysql:8.4
    container_name: monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: monitor_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - monitor_mysql_data:/var/lib/mysql
      - ./sql/mall_tiny.sql:/docker-entrypoint-initdb.d/01_mall_tiny.sql:ro
      - ./sql/monitor.sql:/docker-entrypoint-initdb.d/02_monitor.sql:ro

  redis:
    image: redis:7.4
    container_name: monitor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - monitor_redis_data:/data

  kafka:
    image: apache/kafka:4.3.1
    container_name: monitor-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: monitor-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: monitor
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - monitor_clickhouse_data:/var/lib/clickhouse
      - ./infra/clickhouse/init:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  minio:
    image: minio/minio:latest
    container_name: monitor-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: monitor
      MINIO_ROOT_PASSWORD: monitor123456
    ports:
      - "9002:9000"
      - "9001:9001"
    volumes:
      - monitor_minio_data:/data

volumes:
  monitor_mysql_data:
  monitor_redis_data:
  monitor_clickhouse_data:
  monitor_minio_data:
