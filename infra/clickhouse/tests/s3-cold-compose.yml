name: ${S3_COLD_RUN_ID:?S3_COLD_RUN_ID must be generated by s3-cold-tier.sh}

x-monitor-labels: &monitor-labels
  com.monstereat.observability: "true"
  com.monstereat.s3-cold-e2e: ${S3_COLD_RUN_ID:?S3_COLD_RUN_ID must be generated by s3-cold-tier.sh}

services:
  minio:
    labels: *monitor-labels
    image: rustfs/rustfs@sha256:41fe89380f4120a337790c02af192c3fe7bb55c3edc2e6e9357b487b47c6ab21
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      RUSTFS_SECRET_KEY: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30

  bucket-init:
    labels: *monitor-labels
    image: public.ecr.aws/aws-cli/aws-cli@sha256:1c2d7a51b1ff4f460bc3f1e1ee46a6cef47c7429ad9089ef99012a95e472a1a5
    environment:
      AWS_ACCESS_KEY_ID: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      AWS_SECRET_ACCESS_KEY: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      minio:
        condition: service_healthy
    command:
      - --endpoint-url
      - http://minio:9000
      - s3api
      - create-bucket
      - --bucket
      - clickhouse-cold

  clickhouse:
    labels: *monitor-labels
    image: clickhouse/clickhouse-server:26.8
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${S3_COLD_CLICKHOUSE_PASSWORD:?S3_COLD_CLICKHOUSE_PASSWORD must be generated by s3-cold-tier.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_S3_ENDPOINT: http://minio:9000/clickhouse-cold/
      CLICKHOUSE_S3_ACCESS_KEY_ID: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      CLICKHOUSE_S3_SECRET_ACCESS_KEY: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../config-s3-cold/monitor-s3-cold.xml:/etc/clickhouse-server/config.d/monitor-s3-cold.xml:ro
      - ../init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 10s

volumes:
  minio_data:
  clickhouse_data:
