name: ${S3_COLD_RUN_ID:?S3_COLD_RUN_ID must be generated by s3-cold-tier.sh}

x-monitor-labels: &monitor-labels
  com.monstereat.observability: "true"
  com.monstereat.s3-cold-e2e: ${S3_COLD_RUN_ID:?S3_COLD_RUN_ID must be generated by s3-cold-tier.sh}

services:
  minio:
    labels: *monitor-labels
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      MINIO_ROOT_PASSWORD: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 2s
      retries: 30

  bucket-init:
    labels: *monitor-labels
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    environment:
      MINIO_ROOT_USER: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      MINIO_ROOT_PASSWORD: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" && mc mb --ignore-existing local/clickhouse-cold

  clickhouse:
    labels: *monitor-labels
    image: clickhouse/clickhouse-server:26.8
    depends_on:
      bucket-init:
        condition: service_completed_successfully
    environment:
      CLICKHOUSE_DB: monitor
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${S3_COLD_CLICKHOUSE_PASSWORD:?S3_COLD_CLICKHOUSE_PASSWORD must be generated by s3-cold-tier.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_S3_ENDPOINT: http://minio:9000/clickhouse-cold/
      CLICKHOUSE_S3_ACCESS_KEY_ID: ${S3_COLD_MINIO_USER:?S3_COLD_MINIO_USER must be generated by s3-cold-tier.sh}
      CLICKHOUSE_S3_SECRET_ACCESS_KEY: ${S3_COLD_MINIO_PASSWORD:?S3_COLD_MINIO_PASSWORD must be generated by s3-cold-tier.sh}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../config-s3-cold/monitor-s3-cold.xml:/etc/clickhouse-server/config.d/monitor-s3-cold.xml:ro
      - ../init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' >/dev/null 2>&1"]
      interval: 2s
      timeout: 2s
      retries: 40
      start_period: 10s

volumes:
  minio_data:
  clickhouse_data:
